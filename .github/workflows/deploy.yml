name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Build
        run: |
          if [[ -f angular.json ]]; then
            pnpm install --frozen-lockfile
            pnpm exec ng build
          fi

      - name: Stage static files
        run: |
          mkdir -p _site
          if [[ -d dist/gym-buddy-ui/browser ]]; then
            cp -a dist/gym-buddy-ui/browser/. _site/
          elif [[ -d dist/browser ]]; then
            cp -a dist/browser/. _site/
          elif [[ -d dist ]]; then
            cp -a dist/. _site/
          else
            cp -a public/. _site/
          fi
          if [[ -f _site/index.html ]]; then
            cp _site/index.html _site/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
