name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Verify release source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "v${VERSION}")"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          printf 'Deploying v%s from %s\n' "$VERSION" "$(git rev-parse HEAD)"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Build
        run: |
          if [[ -f angular.json ]]; then
            pnpm install --frozen-lockfile
            pnpm generate:api
            pnpm exec ng build gym-buddy-ui
            pnpm exec ng build gym-buddy-admin
          fi

      - name: Stage static files
        run: python3 .github/scripts/ci/stage_pages.py _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
