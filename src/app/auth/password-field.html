<input
  [type]="visible() ? 'text' : 'password'"
  [formControl]="control()"
  [attr.autocomplete]="autocomplete()"
  [attr.data-testid]="testId()"
/>
<button
  type="button"
  [attr.data-testid]="testId() + '-visibility'"
  [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
  [attr.aria-pressed]="visible()"
  (click)="toggleVisibility()"
>
  @if (visible()) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M3.28 2.22 2.22 3.28l3.07 3.07A11.8 11.8 0 0 0 1.5 12c2.02 4.5 6.4 7.5 10.5 7.5 1.86 0 3.66-.6 5.24-1.66l3.48 3.48 1.06-1.06zM12 17.5c-3.2 0-6.55-2.3-8.32-5.5.7-1.27 1.7-2.4 2.9-3.28l1.7 1.7A4.5 4.5 0 0 0 12 16.5c.5 0 .98-.08 1.43-.23l1.6 1.6c-.95.4-1.97.63-3.03.63m0-11c3.2 0 6.55 2.3 8.32 5.5-.4.73-.9 1.4-1.47 2.01l-1.5-1.5c.3-.47.47-1.03.47-1.63A4.5 4.5 0 0 0 9.62 6.7L8.1 5.18C9.3 4.73 10.63 4.5 12 4.5"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 5c4.1 0 8.48 3 10.5 7.5C20.48 16.99 16.1 20 12 20S3.52 16.99 1.5 12.5C3.52 8 7.9 5 12 5m0 2.5A8.7 8.7 0 0 0 3.68 12.5 8.7 8.7 0 0 0 12 17.5a8.7 8.7 0 0 0 8.32-5A8.7 8.7 0 0 0 12 7.5m0 1.5A3.5 3.5 0 1 1 8.5 12.5 3.5 3.5 0 0 1 12 9"
      />
    </svg>
  }
</button>
