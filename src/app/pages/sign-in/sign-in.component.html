<section>
  <h1>Sign in</h1>
  <p>Use the email and password from registration.</p>

  @if (registered()) {
    <p class="notice" data-testid="sign-in-registered">Account created. Sign in to continue.</p>
  }
  @if (error()) {
    <p class="error" role="alert" data-testid="sign-in-error">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        data-testid="sign-in-email"
      />
    </label>
    <label>
      Password
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        data-testid="sign-in-password"
      />
    </label>
    <button type="submit" data-testid="sign-in-submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p>New here? <a routerLink="/register">Sign up</a></p>
</section>
