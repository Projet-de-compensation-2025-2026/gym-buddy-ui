<section class="auth-page">
  <article class="auth-card card login-card">
    <header class="auth-heading">
      <svg
        class="auth-emblem"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="m6 6 12 12M3 8l5-5M2 5l3-3m11 19 5-5m-2 6 3-3M4 10l6-6m4 16 6-6" />
      </svg>
      <h1 class="auth-brand">Gym Buddy</h1>
      <p class="lede">Welcome back. Let's get to work.</p>
    </header>

    @if (registered()) {
      <p class="notice" data-testid="sign-in-registered">Account created. Sign in to continue.</p>
    }
    @if (error()) {
      <p class="error" role="alert" data-testid="sign-in-error">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Email
        <input
          type="email"
          placeholder="athlete@example.com"
          formControlName="email"
          autocomplete="email"
          data-testid="sign-in-email"
          [class.invalid]="fieldError('email')"
          [attr.aria-invalid]="fieldError('email') ? true : null"
        />
        @if (fieldError('email'); as message) {
          <span class="field-error" role="alert" data-testid="sign-in-email-error">{{
            message
          }}</span>
        }
      </label>
      <label>
        Password
        <app-password-field
          [control]="form.controls.password"
          autocomplete="current-password"
          testId="sign-in-password"
        />
        @if (fieldError('password'); as message) {
          <span class="field-error" role="alert" data-testid="sign-in-password-error">{{
            message
          }}</span>
        }
      </label>
      <button
        type="submit"
        class="btn-primary"
        data-testid="sign-in-submit"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Signing in…' : 'Log In' }}
      </button>
    </form>

    <p class="auth-switch">Don't have an account? <a routerLink="/register">Sign up</a></p>
  </article>
</section>
