<section>
  @if (session.signedIn()) {
    <h1>Feed</h1>
    <p data-testid="home-signed-in">Your friends feed lands in a later slice.</p>
    @if (session.handle(); as handle) {
      <p>
        <a [routerLink]="['/u', handle]">Your profile</a>
        ·
        <a routerLink="/settings/profile">Edit profile</a>
        ·
        <a routerLink="/settings/privacy">Privacy</a>
      </p>
    }
  } @else {
    <h1>Gym Buddy</h1>
    <p>Basic sign-up and sign-in. Friends, feed, and events are not in this slice.</p>
    <p>
      <a routerLink="/register">Sign up</a>
      ·
      <a routerLink="/login">Sign in</a>
    </p>
  }
</section>
