<section>
  <h1>Sign up</h1>
  <p>Create a Gym Buddy account. You will sign in on the next page.</p>

  @if (error()) {
    <p class="error" role="alert" data-testid="sign-up-error">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        data-testid="sign-up-email"
      />
    </label>
    <label>
      Handle
      <input
        type="text"
        formControlName="handle"
        autocomplete="username"
        data-testid="sign-up-handle"
      />
    </label>
    <label>
      Password
      <app-password-field
        [control]="form.controls.password"
        autocomplete="new-password"
        testId="sign-up-password"
      />
    </label>
    <label>
      Display name
      <input
        type="text"
        formControlName="displayName"
        autocomplete="nickname"
        data-testid="sign-up-display-name"
      />
    </label>
    <button type="submit" data-testid="sign-up-submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p>Already registered? <a routerLink="/login">Sign in</a></p>
</section>
