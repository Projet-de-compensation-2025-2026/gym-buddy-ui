# Four-week supply-chain floor (minutes). New resolutions must be this old.
minimumReleaseAge: 40320
# Tight lifecycle allow-list (pnpm 11's allowBuilds; replaces onlyBuiltDependencies).
# These four run install/postinstall because they are native addons Angular 22's
# toolchain actually needs (bundler, cache, file watcher). Everything else stays
# script-blocked.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# Exact versions already on develop (imported from package-lock.json) that are
# younger than four weeks as of 2026-08-18. Newer versions of these packages
# still wait. Drop an entry once that version is older than the floor.
minimumReleaseAgeExclude:
